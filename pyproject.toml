[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adlift"
version = "0.1.0"
description = "Advertising incrementality, brand lift and Bayesian marketing mix modeling, validated against known answers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "duckdb>=1.0",
    "pymc>=5.10",
    "nutpie>=0.13",
    "arviz>=0.17",
    "matplotlib>=3.8",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
adlift = "adlift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: fits a PyMC model or runs a Monte Carlo loop (deselect with -m 'not slow')",
    "realdata: needs datasets from `adlift fetch` (skipped when absent)",
]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501", "B905"]
